[project]
name = "propms"
authors = [
    { name = "Aakvatech", email = "info@aakvatech.com"}
]
description = "Property Management Solution"
requires-python = ">=3.10,<3.15"
dynamic = ["version"]
dependencies = [
    # "frappe" and other framework packages are installed and managed by bench,
    # so they must NOT be listed here. Listing frappe makes uv re-resolve its
    # transitive deps (e.g. the gunicorn git-URL pin) and the install fails.
    # Add only third-party PyPI packages this app genuinely needs.
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"
